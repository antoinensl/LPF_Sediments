# Builds Sediments for Windows and macOS on GitHub's machines.
#  - every push to main: downloadable builds in the "Actions" tab (kept 14 days)
#  - a new version number in CMakeLists.txt: a Release with the two zips, kept for good
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  # First version that downloads is used (newest first).
  LIBTORCH_VERSIONS: "2.15.0 2.14.1 2.13.0 2.12.1 2.11.0 2.10.0 2.9.1"

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Cache libtorch
        id: cache-torch
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: libtorch
          key: libtorch-win-cpu-${{ env.LIBTORCH_VERSIONS }}

      - name: Download libtorch (CPU)
        if: steps.cache-torch.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          foreach ($v in $env:LIBTORCH_VERSIONS.Split(' ')) {
            $url = "https://download.pytorch.org/libtorch/cpu/libtorch-win-shared-with-deps-$v%2Bcpu.zip"
            try {
              Invoke-WebRequest $url -OutFile libtorch.zip -ErrorAction Stop
              Write-Host "Using libtorch $v"
              break
            } catch { Write-Host "Not available: $v" }
          }
          if (!(Test-Path libtorch.zip)) { throw "No libtorch version could be downloaded" }
          7z x libtorch.zip "-o$PWD" -y | Out-Null
          if (!(Test-Path libtorch/lib/torch_cpu.dll)) { throw "libtorch was not extracted as expected" }
          Remove-Item libtorch.zip

      - name: Configure
        run: cmake -B build -A x64 -DCMAKE_PREFIX_PATH="${{ github.workspace }}/libtorch"

      - name: Build
        run: cmake --build build --config Release --parallel --target Sediments_VST3 Sediments_Standalone

      - name: Check that the plugin loads with libtorch
        shell: python
        run: |
          import ctypes, os, glob
          os.add_dll_directory(os.path.abspath("libtorch/lib"))
          dll = glob.glob("build/Sediments_artefacts/Release/VST3/Sediments.vst3/Contents/x86_64-win/*.vst3")[0]
          lib = ctypes.WinDLL(os.path.abspath(dll))
          assert hasattr(lib, "GetPluginFactory"), "no VST3 entry point"
          print("Loaded OK:", dll)

      - name: Package
        shell: pwsh
        run: |
          $out = "LPF-Sediments-Windows"
          New-Item -ItemType Directory "$out/libtorch" | Out-Null
          Copy-Item "build/Sediments_artefacts/Release/VST3/Sediments.vst3" $out -Recurse
          Copy-Item "libtorch/lib/*.dll" "$out/libtorch"
          Copy-Item "packaging/windows/*" $out
          Copy-Item LICENSE, THIRD_PARTY_NOTICES.md $out
          Copy-Item licenses $out -Recurse
          7z a -tzip LPF-Sediments-Windows.zip $out | Out-Null
          Get-Item LPF-Sediments-Windows.zip | Select-Object Name, Length

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: LPF-Sediments-Windows
          path: LPF-Sediments-Windows.zip
          retention-days: 14

  macos:
    runs-on: macos-latest      # Apple Silicon
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Cache libtorch
        id: cache-torch
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: libtorch
          key: libtorch-macos-arm64-${{ env.LIBTORCH_VERSIONS }}

      - name: Download libtorch (Apple Silicon)
        if: steps.cache-torch.outputs.cache-hit != 'true'
        run: |
          for v in $LIBTORCH_VERSIONS; do
            if curl -fsSL -o libtorch.zip "https://download.pytorch.org/libtorch/cpu/libtorch-macos-arm64-$v.zip"; then
              echo "Using libtorch $v"; break
            fi
            echo "Not available: $v"
          done
          test -f libtorch.zip || { echo "No libtorch version could be downloaded"; exit 1; }
          unzip -q libtorch.zip && rm libtorch.zip

      - name: Configure
        run: >
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="$PWD/libtorch"
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0

      - name: Build
        run: cmake --build build --parallel --target Sediments_VST3 Sediments_AU Sediments_Standalone

      - name: Check that the bundles load with their own libtorch
        run: |
          for b in build/Sediments_artefacts/Release/VST3/Sediments.vst3 build/Sediments_artefacts/Release/AU/Sediments.component; do
            bin="$b/Contents/MacOS/Sediments"
            otool -l "$bin" | grep -A2 LC_RPATH | grep path
            ls "$b/Contents/Frameworks" | head -20
            python3 -c "import ctypes,sys; ctypes.CDLL(sys.argv[1]); print('Loaded OK:', sys.argv[1])" "$bin"
          done

      - name: Package
        run: |
          out=LPF-Sediments-macOS
          mkdir "$out"
          cp -R build/Sediments_artefacts/Release/VST3/Sediments.vst3 "$out/"
          cp -R build/Sediments_artefacts/Release/AU/Sediments.component "$out/"
          cp -R build/Sediments_artefacts/Release/Standalone/Sediments.app "$out/"
          cp packaging/macos/* "$out/"
          cp LICENSE THIRD_PARTY_NOTICES.md "$out/"
          cp -R licenses "$out/"
          chmod +x "$out/Install.command"
          # ad-hoc signature (free; enough for the plugin to load on your own Mac)
          for b in "$out/Sediments.vst3" "$out/Sediments.component" "$out/Sediments.app"; do
            codesign --force --deep --sign - "$b"
          done
          ditto -c -k --keepParent "$out" LPF-Sediments-macOS.zip
          ls -lh LPF-Sediments-macOS.zip

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: LPF-Sediments-macOS
          path: LPF-Sediments-macOS.zip
          retention-days: 14

  # Publishes a Release when the version in CMakeLists.txt has none yet
  # (raise "project(Sediments VERSION x.y.z)" to publish a new one).
  release:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Read the version
        id: version
        run: |
          v=$(sed -n 's/^project(Sediments VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"; echo "Release v$v already exists"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"; echo "Will publish v$v"
          fi

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: steps.version.outputs.exists == 'false'
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        if: steps.version.outputs.exists == 'false'
        run: cd dist && sha256sum *.zip | tee SHA256SUMS.txt

      - name: Build provenance attestation
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        if: steps.version.outputs.exists == 'false'
        with:
          subject-path: dist/*.zip

      - name: Publish the release
        if: steps.version.outputs.exists == 'false'
        run: |
          gh release create "${{ steps.version.outputs.tag }}" dist/*.zip dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "Sediments ${{ steps.version.outputs.tag }}" \
            --notes "Windows: LPF-Sediments-Windows.zip (unzip, then double-click INSTALL.bat). Apple Silicon Mac, macOS 14 or later: LPF-Sediments-macOS.zip (right-click Install.command, then Open). See README.txt in each zip. Verify a download: gh attestation verify <file>.zip -R lifepassfilter/LPF_Sediments (checksums in SHA256SUMS.txt)." \
            --generate-notes
